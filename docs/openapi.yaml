openapi: 3.0.3
info:
  title: API Raízes do Nordeste
  description: |
    API back-end da rede de lanchonetes Raízes do Nordeste: pedidos multicanal
    (APP, TOTEM, BALCAO, PICKUP, WEB), cardápio e estoque por unidade,
    fidelização com consentimento LGPD e pagamento simulado (mock).

    **Fluxo crítico do MVP:** criar pedido (valida estoque) → pagamento mock →
    atualização de status (EM_PREPARO → PRONTO → ENTREGUE / CANCELADO).

    **Padrão de erro:** toda falha responde no mesmo formato JSON (erro, mensagem,
    detalhes, timestamp e caminho). Formas de pagamento: DINHEIRO, PIX, CARTAO e
    CARTAO_RECUSADO (gatilho determinístico de recusa para os testes).
  version: 1.0.0

servers:
  - url: http://localhost:3000
    description: Execução local

tags:
  - name: Auth
  - name: Usuários
  - name: Unidades
  - name: Produtos
  - name: Estoque
  - name: Pedidos
  - name: Pagamentos
  - name: Fidelidade
  - name: Auditoria

security:
  - bearerAuth: []

paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: Autentica o usuário e devolve o token JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, senha]
              properties:
                email: { type: string, example: cliente@raizes.com }
                senha: { type: string, example: "Senha@123" }
            example:
              email: cliente@raizes.com
              senha: "Senha@123"
      responses:
        '200':
          description: Autenticado
          content:
            application/json:
              example:
                accessToken: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                tokenType: "Bearer"
                expiresIn: 28800
                user:
                  id: 4
                  nome: "Maria da Silva"
                  email: "cliente@raizes.com"
                  perfil: "CLIENTE"
        '400': { $ref: '#/components/responses/Erro400' }
        '401':
          description: Credenciais inválidas
          content:
            application/json:
              example:
                error: "CREDENCIAIS_INVALIDAS"
                message: "E-mail ou senha inválidos."
                details: []
                timestamp: "2026-11-24T12:00:00.000Z"
                path: "/auth/login"

  /usuarios:
    post:
      tags: [Usuários]
      summary: Cadastro público de cliente (com consentimento LGPD opcional)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            example:
              nome: "Teste Silva"
              email: "teste@teste.com"
              senha: "Senha@123"
              aceitaFidelidade: true
      responses:
        '201':
          description: Cliente criado (com dataConsentimento quando aceita fidelidade)
          content:
            application/json:
              example:
                id: 6
                nome: "Teste Silva"
                email: "teste@teste.com"
                perfil: "CLIENTE"
                dataConsentimento: "2026-11-24T12:00:00.000Z"
                versaoTermo: "1.0"
                criadoEm: "2026-11-24T12:00:00.000Z"
        '409':
          description: E-mail já cadastrado
          content:
            application/json:
              example:
                error: "EMAIL_JA_CADASTRADO"
                message: "Já existe uma conta com este e-mail."
                details: []
                timestamp: "2026-11-24T12:00:00.000Z"
                path: "/usuarios"
        '422': { $ref: '#/components/responses/Erro422' }

  /usuarios/{id}:
    get:
      tags: [Usuários]
      summary: Consulta o próprio perfil (ou qualquer um, se GERENTE) — gera log de auditoria
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: Dados do usuário (sem senhaHash) }
        '401': { $ref: '#/components/responses/Erro401' }
        '403': { $ref: '#/components/responses/Erro403' }
        '404': { $ref: '#/components/responses/Erro404' }

  /unidades:
    get:
      tags: [Unidades]
      summary: Lista unidades ativas (público, paginado)
      security: []
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, default: 10, maximum: 100 } }
      responses:
        '200':
          description: Página de unidades
          content:
            application/json:
              example:
                dados:
                  - { id: 1, nome: "Recife — Boa Viagem (matriz)", cidade: "Recife", ativa: true }
                pagina: 1
                limite: 10
                total: 3
                totalPaginas: 1

  /produtos:
    get:
      tags: [Produtos]
      summary: Cardápio da unidade (público) ou lista geral de produtos
      security: []
      parameters:
        - { name: unidadeId, in: query, schema: { type: integer }, description: "Se informado, devolve o cardápio com saldo disponível na unidade" }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, default: 10 } }
      responses:
        '200': { description: Cardápio paginado com quantidadeDisponivel }
        '404': { $ref: '#/components/responses/Erro404' }
    post:
      tags: [Produtos]
      summary: Cria produto (GERENTE)
      requestBody:
        required: true
        content:
          application/json:
            example:
              nome: "Cuscuz do Nordeste"
              precoUnitario: 16.5
              categoria: "Cuscuz"
              descricao: "Cuscuz com queijo coalho"
      responses:
        '201': { description: Produto criado }
        '401': { $ref: '#/components/responses/Erro401' }
        '403': { $ref: '#/components/responses/Erro403' }
        '422': { $ref: '#/components/responses/Erro422' }

  /produtos/{id}:
    put:
      tags: [Produtos]
      summary: Atualiza produto (GERENTE)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        content:
          application/json:
            example:
              precoUnitario: 17.9
      responses:
        '200': { description: Produto atualizado }
        '404': { $ref: '#/components/responses/Erro404' }
    delete:
      tags: [Produtos]
      summary: Exclui produto (GERENTE) — 409 se já aparece em pedidos
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '204': { description: Excluído }
        '404': { $ref: '#/components/responses/Erro404' }
        '409':
          description: Produto em uso
          content:
            application/json:
              example:
                error: "PRODUTO_EM_USO"
                message: "O produto já aparece em pedidos e não pode ser excluído; marque como indisponível."
                details: []
                timestamp: "2026-11-24T12:00:00.000Z"
                path: "/produtos/1"

  /estoque/{unidadeId}:
    get:
      tags: [Estoque]
      summary: Saldo de cada produto na unidade (ATENDENTE, COZINHA, GERENTE)
      parameters:
        - { name: unidadeId, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Saldo por produto
          content:
            application/json:
              example:
                unidade: { id: 1, nome: "Recife — Boa Viagem (matriz)" }
                itens:
                  - { produtoId: 1, produto: "Tapioca de carne seca", quantidade: 50, minimo: 5, abaixoDoMinimo: false }
        '401': { $ref: '#/components/responses/Erro401' }
        '403': { $ref: '#/components/responses/Erro403' }

  /estoque/movimentos:
    post:
      tags: [Estoque]
      summary: Registra entrada ou saída com rastreabilidade (ATENDENTE ou GERENTE)
      requestBody:
        required: true
        content:
          application/json:
            example:
              unidadeId: 1
              produtoId: 1
              tipo: "ENTRADA"
              quantidade: 20
      responses:
        '201':
          description: Movimento registrado
          content:
            application/json:
              example:
                movimentoId: 1
                produtoId: 1
                produto: "Tapioca de carne seca"
                tipo: "ENTRADA"
                quantidade: 20
                saldoAtual: 70
                dataHora: "2026-11-24T12:00:00.000Z"
        '409':
          description: Estoque insuficiente (saída)
          content:
            application/json:
              example:
                error: "ESTOQUE_INSUFICIENTE"
                message: "Não há saldo suficiente para essa saída."
                details:
                  - { field: "quantidade", issue: "Disponível: 20" }
                timestamp: "2026-11-24T12:00:00.000Z"
                path: "/estoque/movimentos"

  /pedidos:
    post:
      tags: [Pedidos]
      summary: Cria pedido com canalPedido obrigatório e baixa de estoque (CLIENTE ou ATENDENTE)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PedidoCreate'
            example:
              unidadeId: 1
              canalPedido: "TOTEM"
              itens:
                - { produtoId: 1, quantidade: 2 }
                - { produtoId: 5, quantidade: 1 }
              formaPagamento: "PIX"
      responses:
        '201':
          description: Pedido criado em AGUARDANDO_PAGAMENTO
          content:
            application/json:
              example:
                pedidoId: 1
                status: "AGUARDANDO_PAGAMENTO"
                canalPedido: "TOTEM"
                unidadeId: 1
                clienteId: 4
                total: 42.3
                itens:
                  - { produtoId: 1, quantidade: 2, precoUnitario: 18.9 }
                  - { produtoId: 5, quantidade: 1, precoUnitario: 4.5 }
                criadoEm: "2026-11-24T12:00:00.000Z"
        '404':
          description: Unidade ou produto inexistente
          content:
            application/json:
              example:
                error: "NAO_ENCONTRADO"
                message: "Produto 999 não encontrado."
                details: []
                timestamp: "2026-11-24T12:00:00.000Z"
                path: "/pedidos"
        '409':
          description: Estoque insuficiente ou produto indisponível
          content:
            application/json:
              example:
                error: "ESTOQUE_INSUFICIENTE"
                message: "Não há quantidade suficiente para um ou mais itens."
                details:
                  - { field: "itens[produtoId=10].quantidade", issue: "Disponível: 0" }
                timestamp: "2026-11-24T12:00:00.000Z"
                path: "/pedidos"
        '422':
          description: canalPedido ausente/inválido ou itens inválidos
          content:
            application/json:
              example:
                error: "VALIDACAO_INVALIDA"
                message: "O campo canalPedido deve ser um de: APP, TOTEM, BALCAO, PICKUP, WEB."
                details:
                  - { field: "canalPedido", issue: "valor recebido: \"KIOSK\"" }
                timestamp: "2026-11-24T12:00:00.000Z"
                path: "/pedidos"
    get:
      tags: [Pedidos]
      summary: Consulta pedidos com filtros (CLIENTE vê só os próprios)
      parameters:
        - { name: canalPedido, in: query, schema: { type: string, enum: [APP, TOTEM, BALCAO, PICKUP, WEB] } }
        - { name: status, in: query, schema: { type: string, enum: [AGUARDANDO_PAGAMENTO, EM_PREPARO, PRONTO, ENTREGUE, CANCELADO] } }
        - { name: unidadeId, in: query, schema: { type: integer } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, default: 10 } }
      responses:
        '200': { description: Página de pedidos }
        '422': { $ref: '#/components/responses/Erro422' }

  /pedidos/{id}/status:
    patch:
      tags: [Pedidos]
      summary: Avança status ou cancela (RN05/RN06)
      description: |
        Transições válidas: AGUARDANDO_PAGAMENTO → CANCELADO (dono/ATENDENTE/GERENTE, devolve estoque);
        EM_PREPARO → PRONTO (COZINHA/GERENTE); PRONTO → ENTREGUE (ATENDENTE/GERENTE).
        AGUARDANDO_PAGAMENTO → EM_PREPARO só acontece pelo pagamento.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            example:
              status: "PRONTO"
      responses:
        '200':
          description: Status atualizado
          content:
            application/json:
              example:
                pedidoId: 1
                statusAnterior: "EM_PREPARO"
                status: "PRONTO"
        '403': { $ref: '#/components/responses/Erro403' }
        '404': { $ref: '#/components/responses/Erro404' }
        '409':
          description: Transição inválida
          content:
            application/json:
              example:
                error: "TRANSICAO_STATUS_INVALIDA"
                message: "O pedido só sai de AGUARDANDO_PAGAMENTO pelo pagamento (POST /pagamentos)."
                details: []
                timestamp: "2026-11-24T12:00:00.000Z"
                path: "/pedidos/1/status"

  /pagamentos:
    post:
      tags: [Pagamentos]
      summary: Solicita pagamento ao gateway mock e registra o resultado (CLIENTE ou ATENDENTE)
      requestBody:
        required: true
        content:
          application/json:
            example:
              pedidoId: 1
              formaPagamento: "PIX"
      responses:
        '201':
          description: Pagamento registrado; aprovado move o pedido para EM_PREPARO e acumula pontos
          content:
            application/json:
              example:
                pagamento:
                  id: 1
                  pedidoId: 1
                  provedor: "MOCK"
                  formaPagamento: "PIX"
                  status: "APROVADO"
                  mensagem: "Pagamento aprovado (simulação)."
                  codigoAutorizacao: "MOCK-1795564099494-529"
                  dataHora: "2026-11-24T12:00:00.000Z"
                pedido:
                  pedidoId: 1
                  status: "EM_PREPARO"
                  total: 42.3
                fidelidade:
                  pontosAcumulados: 4
                  motivo: null
        '409':
          description: Pedido não está em AGUARDANDO_PAGAMENTO (ou recusa do gateway)
          content:
            application/json:
              example:
                error: "PEDIDO_NAO_AGUARDANDO_PAGAMENTO"
                message: "O pedido está em EM_PREPARO; só é possível pagar pedidos em AGUARDANDO_PAGAMENTO."
                details: []
                timestamp: "2026-11-24T12:00:00.000Z"
                path: "/pagamentos"
        '422': { $ref: '#/components/responses/Erro422' }

  /pagamentos/{id}:
    get:
      tags: [Pagamentos]
      summary: Consulta pagamento (dono do pedido ou perfis internos)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: Pagamento com pedido resumido }
        '404': { $ref: '#/components/responses/Erro404' }

  /fidelidade/saldo:
    get:
      tags: [Fidelidade]
      summary: Saldo de pontos e situação do consentimento (CLIENTE)
      responses:
        '200':
          description: Saldo
          content:
            application/json:
              example:
                clienteId: 4
                consentimentoFidelidade: true
                versaoTermo: "1.0"
                saldoPontos: 350

  /fidelidade/lancamentos:
    get:
      tags: [Fidelidade]
      summary: Histórico de acúmulos e resgates (CLIENTE, paginado)
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, default: 10 } }
      responses:
        '200': { description: Histórico paginado }

  /fidelidade/resgates:
    post:
      tags: [Fidelidade]
      summary: Resgate simples — múltiplo de 100 pontos (CLIENTE; 100 pontos = R$ 10)
      requestBody:
        required: true
        content:
          application/json:
            example:
              pontos: 100
      responses:
        '201':
          description: Resgate efetuado
          content:
            application/json:
              example:
                lancamentoId: 3
                pontosResgatados: 100
                cupomDesconto: "R$ 10.00"
                saldoPontos: 257
                dataHora: "2026-11-24T12:00:00.000Z"
        '409':
          description: Sem consentimento ou saldo insuficiente
          content:
            application/json:
              example:
                error: "SALDO_INSUFICIENTE"
                message: "Saldo de pontos insuficiente para esse resgate."
                details:
                  - { field: "pontos", issue: "Disponível: 7 pontos" }
                timestamp: "2026-11-24T12:00:00.000Z"
                path: "/fidelidade/resgates"
        '422': { $ref: '#/components/responses/Erro422' }

  /logs:
    get:
      tags: [Auditoria]
      summary: Consulta logs de auditoria (GERENTE)
      parameters:
        - { name: entidade, in: query, schema: { type: string, example: Pedido } }
        - { name: entidadeId, in: query, schema: { type: integer } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, default: 10 } }
      responses:
        '200':
          description: Logs paginados
          content:
            application/json:
              example:
                dados:
                  - { id: 5, acao: "PEDIDO_CRIADO", entidade: "Pedido", entidadeId: 1, detalhe: "2 item(ns), total R$ 42.30, canal TOTEM, unidade 1", dataHora: "2026-11-24T12:00:00.000Z" }
                pagina: 1
                limite: 10
                total: 5
                totalPaginas: 1
        '403': { $ref: '#/components/responses/Erro403' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    PedidoCreate:
      type: object
      required: [unidadeId, canalPedido, itens]
      properties:
        unidadeId: { type: integer }
        canalPedido:
          type: string
          enum: [APP, TOTEM, BALCAO, PICKUP, WEB]
          description: "Obrigatório — dado de domínio da multicanalidade"
        clienteId: { type: integer, description: "Opcional; só faz sentido para ATENDENTE" }
        itens:
          type: array
          minItems: 1
          items:
            type: object
            required: [produtoId, quantidade]
            properties:
              produtoId: { type: integer }
              quantidade: { type: integer, minimum: 1 }

    ErroPadrao:
      type: object
      properties:
        error: { type: string, example: "ESTOQUE_INSUFICIENTE" }
        message: { type: string, example: "Não há quantidade suficiente para um ou mais itens." }
        details:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              issue: { type: string }
        timestamp: { type: string, format: date-time }
        path: { type: string }

  responses:
    Erro400:
      description: Requisição malformada
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErroPadrao' }
    Erro401:
      description: Não autenticado
      content:
        application/json:
          example:
            error: "NAO_AUTENTICADO"
            message: "Token ausente ou inválido."
            details: []
            timestamp: "2026-11-24T12:00:00.000Z"
            path: "/pedidos"
    Erro403:
      description: Sem permissão para o perfil
      content:
        application/json:
          example:
            error: "SEM_PERMISSAO"
            message: "Seu perfil não tem permissão para esta operação."
            details: []
            timestamp: "2026-11-24T12:00:00.000Z"
            path: "/produtos"
    Erro404:
      description: Não encontrado
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErroPadrao' }
    Erro422:
      description: Validação inválida
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErroPadrao' }
